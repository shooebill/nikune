[project]
name = "nikune"
version = "0.0.0"
requires-python = ">=3.13"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 0  # VERTICAL形式（縦並び）

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "flask>=3.1.2",
    "line-bot-sdk>=3.21.0",
    "pytest>=8.4.2",
    "types-requests>=2.32.0.20241016",
]
